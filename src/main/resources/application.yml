spring:
  application:
    name: nexarank-api
  data:
    redis:
      host: ${REDIS_HOST:redis-master.default.svc.cluster.local}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${DB_URL:jdbc:postgresql://nexarank-postgres-postgresql.default.svc.cluster.local:5432/nexarank}
    username: ${DB_USERNAME:nexarank}
    password: ${DB_PASSWORD:nexarank2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: modernreliability@gmail.com
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    mail:
      enabled: false
  metrics:
    tags:
      # common tag on every meter so dashboards/alerts can scope to this service
      application: nexarank-api
    distribution:
      # publish histogram buckets so Prometheus can compute p95/p99 via
      # histogram_quantile() for the enrich SLIs
      percentiles-histogram:
        http.server.requests: true
        nexarank.enrich.rules: true
      slo:
        # rules-only enrich latency SLO boundaries (excludes LLM stages, which
        # live in the PRE_QUERY group; this timer wraps RULE_APPLICATION only)
        nexarank.enrich.rules: 10ms,25ms,50ms,100ms,250ms

logging:
  level:
    com.nexarank: DEBUG

nexarank:
  jwt:
    secret: ${JWT_SECRET:nexarank-dev-secret-key-2026-minimum-32-chars}
    # NR-120: access tokens are now short-lived (15 min default); session
    # longevity comes from the separate, revocable refresh token instead.
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  cookie:
    # No TLS in this Kind dev cluster yet (NR-35 will add it) - a hardcoded
    # Secure attribute would mean the browser never sends the cookie at all
    # here. Flip to true once real TLS exists.
    secure: ${COOKIE_SECURE:false}
  search-api:
    base-url: http://search-api.default.svc.cluster.local/api/v1
    api-key: searchx-dev-key-2026
  report:
    from: modernreliability@gmail.com
    cron: "0 0 8 * * MON"
  monthly-report:
    cron: "0 0 8 1 * *"

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:gemma3:1b}